<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>Demo Shop</header>
<main>
  <h1>Checkout</h1>
  <p class="sub">One item, ₹449. Synthetic payment page. The card form comes from another origin, like a real payment provider.</p>
  <section class="card">
    <div class="field"><label for="email">Email for the receipt</label><input id="email" type="email" autocomplete="email" value="ananya.rao@mail.in"></div>
    <iframe class="pay" title="Card payment" width="520" height="210"></iframe>
  </section>
</main>
<script>
  // Serve the card form from the other loopback name so it is cross-origin, as a real provider would be.
  const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  document.querySelector('.pay').src = `${location.protocol}//${other}:${location.port}/card-frame.html`;
</script>
</body>
</html>
