<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card payment</title><link rel="stylesheet" href="style.css"><style>body{background:#fff}main{margin:0;padding:14px}</style></head>
<body>
<main>
  <div class="grid">
    <div class="field wide"><label for="cc">Card number</label><input id="cc" autocomplete="cc-number" value="4111 1111 1111 1111"></div>
    <div class="field"><label for="exp">Expiry</label><input id="exp" autocomplete="cc-exp" value="08/29"></div>
    <div class="field"><label for="cvv">CVV</label><input id="cvv" type="password" autocomplete="cc-csc" value="123"></div>
  </div>
</main>
</body>
</html>
